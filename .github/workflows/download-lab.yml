name: Download Lab

# Dispatch-only + branch-scoped-push diagnostic (t_acad0d29, lab v3):
# root cause isolated to client.py _collect_proc_diagnostics
# (select-then-read(8192) blocks on a failed handshake with a live
# child). Arms: A unpatched control under faulthandler; B PR #6's
# queue/reader-thread path forced on Linux (legible failure expected);
# C patched + --auth-timeout 300 (does crush authenticate given time?);
# D partial-line buffering probe (job-level kill at 60s). This branch
# is never opened as a PR; its push trigger fires only here, never on
# main. Red rc is an EXPECTED outcome in A/B (captured via || echo).

on:
  push:
    branches:
      - diag/download-lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a-control-faulthandler:
    name: "A - unpatched control (faulthandler)"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unpatched verifier, stack dump at 150s
        run: |
          timeout 330 python3 -u -X faulthandler - <<'PY' || echo "A rc=$? (124 = hung, as expected if unpatched)"
          import sys, faulthandler
          sys.path.insert(0, '.github/workflows')
          import verify_agents
          faulthandler.dump_traceback_later(150)
          sys.argv = ['verify_agents.py', '--auth-check', '--agent', 'crush-acp']
          verify_agents.main()
          PY

  b-patched-legible:
    name: "B - #6 queue path forced (legible failure expected)"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Patched verifier (reader-thread path, default 120s handshake)
        run: |
          timeout 330 python3 -u - <<'PY' || echo "B rc=$? (red is the EXPECTED verdict; legible output is the test)"
          import sys
          sys.path.insert(0, '.github/workflows')
          import registry_utils
          registry_utils._TIMED_READ_USES_SELECT = False
          import verify_agents
          sys.argv = ['verify_agents.py', '--auth-check', '--agent', 'crush-acp']
          verify_agents.main()
          PY

  c-patched-longtimeout:
    name: "C - patched + auth-timeout 300 (money arm)"
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Patched verifier, 300s handshake budget (initial + retry fits 660s)
        run: |
          timeout 660 python3 -u - <<'PY' || echo "C rc=$? (0 = crush AUTHENTICATED given time)"
          import sys
          sys.path.insert(0, '.github/workflows')
          import registry_utils
          registry_utils._TIMED_READ_USES_SELECT = False
          import verify_agents
          sys.argv = ['verify_agents.py', '--auth-check', '--auth-timeout', '300', '--agent', 'crush-acp']
          verify_agents.main()
          PY

  d-buffering-probe:
    name: "D - partial-line buffering probe (expected: cancelled at 60s)"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Complete line, then partial line, then hang until job kill
        run: |
          python3 -c "import sys,time; print('COMPLETE-LINE-PROBE'); sys.stdout.write('PARTIAL-LINE-PROBE'); sys.stdout.flush(); time.sleep(300)"
          echo "never reached"

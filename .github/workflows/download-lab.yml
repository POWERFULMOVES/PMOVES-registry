name: Download Lab

# Dispatch-only + branch-scoped-push diagnostic (t_acad0d29): profiles
# hosted-runner egress to the crush-acp release asset. This branch is
# never opened as a PR; the push trigger fires only on this branch and
# can never fire on main. Re-runs = empty-commit pushes to this branch.

on:
  push:
    branches:
      - diag/download-lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Egress probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: urllib progression (same stack as verify_agents.py)
        run: |
          python3 -u - <<'PY'
          import time, urllib.request
          url = "https://github.com/POWERFULMOVES/PMOVES-crush/releases/download/v0.91.2-pmoves.2/crush_0.91.2-pmoves.2_Linux_x86_64.tar.gz"
          req = urllib.request.Request(url, headers={"User-Agent": "ACP-Registry-Verifier/1.0"})
          t0 = time.time(); n = 0; last = t0; lastn = 0
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  print("OPEN %.1fs status=%s len=%s" % (time.time()-t0, r.status, r.headers.get("Content-Length")), flush=True)
                  while True:
                      c = r.read(65536)
                      if not c:
                          break
                      n += len(c)
                      if time.time() - t0 > 180:
                          print("BUDGET-STOP t=180s total=%.2fMB" % (n/1048576), flush=True)
                          break
                      if time.time() - last >= 10:
                          w = time.time() - last
                          print("t=%4.0fs total=%7.2fMB window=%5.0fKB/s" % (time.time()-t0, n/1048576, (n-lastn)/w/1024), flush=True)
                          last = time.time(); lastn = n
              print("DONE %.2fMB in %.1fs" % (n/1048576, time.time()-t0), flush=True)
          except Exception as e:
              print("URLLIB-FAIL t=%.0fs total=%.2fMB %s: %s" % (time.time()-t0, n/1048576, type(e).__name__, e), flush=True)
          PY

      - name: curl github.com URL, v4 then v6
        run: |
          U="https://github.com/POWERFULMOVES/PMOVES-crush/releases/download/v0.91.2-pmoves.2/crush_0.91.2-pmoves.2_Linux_x86_64.tar.gz"
          for F in -4 -6; do
            curl $F -sL -o "/tmp/c$F.bin" --max-time 60 -w "curl $F code=%{http_code} size=%{size_download} speed=%{speed_download}B/s time=%{time_total}s\n" "$U" || echo "curl $F rc=$?"
          done

      - name: curl controls - CDN-resolved URL + cross-repo (uv) asset
        run: |
          U="https://github.com/POWERFULMOVES/PMOVES-crush/releases/download/v0.91.2-pmoves.2/crush_0.91.2-pmoves.2_Linux_x86_64.tar.gz"
          R=$(curl -4 -sI -o /dev/null -w '%{redirect_url}' "$U")
          echo "resolved host: $(printf %s "$R" | cut -d/ -f3)"
          curl -4 -sL -o /tmp/cdn.bin --max-time 60 -w "cdn code=%{http_code} size=%{size_download} speed=%{speed_download}B/s time=%{time_total}s\n" "$R" || echo "cdn rc=$?"
          V="https://github.com/astral-sh/uv/releases/download/0.12.19/uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -4 -sL -o /tmp/uvctl.bin --max-time 60 -w "uv-control code=%{http_code} size=%{size_download} speed=%{speed_download}B/s time=%{time_total}s\n" "$V" || echo "uv-control rc=$?"
